name: mirage_by_aurues
description: "Mirage — Premium AR Furniture E-Commerce"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # State Management & DI
  provider: ^6.1.2
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Camera
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Serialization
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.8.1

  # Utils
  equatable: ^2.0.7
  shake: ^3.0.0
  dartz: ^0.10.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  flutter_embed_unity: ^1.5.0
  flutter_embed_unity_6000_0_android: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - lib/images/
    - lib/images/backgrounds/

