<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&amp;family=Manrope:wght@400;500;700&amp;family=Space_Grotesk:wght@300;400;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            backdrop-filter: blur(24px);
            background: rgba(30, 32, 30, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glow-amber {
            box-shadow: 0 0 20px rgba(248, 187, 115, 0.15);
        }
        .ethereal-gradient {
            background: radial-gradient(circle at center, rgba(105, 64, 0, 0.15) 0%, transparent 70%);
        }
        .dotted-texture {
            background-image: radial-gradient(rgba(248, 187, 115, 0.15) 1px, transparent 1px);
            background-size: 12px 12px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-container": "#29372e",
                        "outline": "#8e928c",
                        "on-surface": "#e2e3df",
                        "on-surface-variant": "#c4c8c1",
                        "secondary-fixed-dim": "#f8bb73",
                        "surface-dim": "#121412",
                        "primary-fixed-dim": "#bfc9be",
                        "on-secondary": "#472a00",
                        "surface-container": "#1e201e",
                        "tertiary-fixed-dim": "#bbcabe",
                        "secondary-container": "#694000",
                        "surface-container-lowest": "#0d0f0d",
                        "background": "#121412",
                        "on-tertiary-fixed": "#111e17",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#333533",
                        "surface": "#121412",
                        "primary-container": "#2d362e",
                        "on-background": "#e2e3df",
                        "surface-container-highest": "#333533",
                        "inverse-primary": "#576158",
                        "on-error": "#690005",
                        "secondary-fixed": "#ffddb9",
                        "error": "#ffb4ab",
                        "on-primary-container": "#959f94",
                        "surface-tint": "#bfc9be",
                        "outline-variant": "#444843",
                        "surface-container-high": "#282a28",
                        "inverse-surface": "#e2e3df",
                        "error-container": "#93000a",
                        "on-secondary-container": "#e8ad67",
                        "tertiary": "#bbcabe",
                        "surface-container-low": "#1a1c1a",
                        "on-tertiary": "#26332b",
                        "on-secondary-fixed-variant": "#663e00",
                        "on-tertiary-container": "#91a095",
                        "on-tertiary-fixed-variant": "#3c4a41",
                        "tertiary-fixed": "#d7e6da",
                        "primary-fixed": "#dbe5d9",
                        "surface-bright": "#383a37",
                        "on-primary": "#2a332b",
                        "secondary": "#f8bb73",
                        "inverse-on-surface": "#2f312f",
                        "on-primary-fixed-variant": "#404941",
                        "primary": "#bfc9be",
                        "on-primary-fixed": "#151e16",
                        "on-secondary-fixed": "#2b1700"
                    },
                    fontFamily: {
                        "headline": ["Epilogue"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary/30 overflow-hidden">
<!-- Background Layer -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover opacity-40 mix-blend-lighten" data-alt="misty ethereal forest with tall trees and soft golden light beams breaking through heavy fog and green foliage" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsqimvtfbswTfs2rVhIBa65meweXA1oRBtQf3Vjzp9AfhTsklAH-AMnCjLFgFtD747kkCSDKpT_9YnRIOdSYv_M37q02MI1DgdgS8GLI0luINk48h0gHL8GeP-8IrOcIIX2tDe6rggh3zr8T-a62c4J2_miQXW3faRwhDS33WTIyLP9XKd6y1ZH6wioEPWV-Zv9Ib1SBOjvsgFd9hGCcKynTBosvprryurj3C4S24jFG589VUERW4iSWcAAtwDbZw28eZKAZ-vKg"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-lowest/80 via-transparent to-surface-container-lowest"></div>
<div class="absolute inset-0 ethereal-gradient"></div>
</div>
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-2 p-1 rounded-full glass-panel shadow-lg pointer-events-auto">
<div class="p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-emerald-400/80 text-xl" data-icon="panorama_fish_eye">panorama_fish_eye</span>
</div>
<button class="hover:bg-secondary/10 transition-colors duration-300 p-2 rounded-full active:scale-95 text-on-surface-variant/60 hover:text-secondary">
<span class="material-symbols-outlined text-xl" data-icon="shopping_cart">shopping_cart</span>
</button>
</div>
<div class="flex items-center p-1 rounded-full glass-panel shadow-lg pointer-events-auto">
<button class="hover:bg-secondary/10 transition-colors duration-300 p-2 rounded-full active:scale-95 text-on-surface-variant/60 hover:text-secondary">
<span class="material-symbols-outlined text-xl" data-icon="account_circle">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6 pt-16 pb-32">
<!-- Status Indicator -->
<div class="mb-12 text-center">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel mb-4">
<span class="w-1.5 h-1.5 rounded-full animate-pulse bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
<span class="font-label text-[10px] tracking-widest uppercase text-emerald-400">ONLINE</span>
</div>
</div>
<!-- Central Circular HUD -->
<div class="relative w-80 h-80 flex items-center justify-center">
<!-- Outer Ring Glow -->
<div class="absolute inset-0 rounded-full border border-secondary/10 glow-amber blur-sm"></div>
<!-- Rotating/Static Decorative Rings -->
<div class="absolute inset-4 rounded-full border-[0.5px] border-outline-variant/20"></div>
<div class="absolute inset-8 rounded-full border-t border-l border-secondary/30 opacity-40"></div>
<!-- HUD NAVIGATION BUTTONS -->
<!-- Top: Profile -->
<button class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-4 w-14 h-14 glass-panel rounded-full flex items-center justify-center text-primary hover:text-secondary transition-all active:scale-90 group z-20 shadow-xl">
<div class="absolute inset-0 rounded-full group-hover:bg-secondary/5 transition-colors"></div>
<span class="material-symbols-outlined text-2xl" data-icon="person">person</span>
</button>
<!-- Bottom: AR -->
<button class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-4 w-14 h-14 glass-panel rounded-full flex items-center justify-center text-primary hover:text-secondary transition-all active:scale-90 group z-20 shadow-xl">
<div class="absolute inset-0 rounded-full group-hover:bg-secondary/5 transition-colors"></div>
<span class="material-symbols-outlined text-2xl" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</button>
<!-- Left: Home -->
<button class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-4 w-14 h-14 glass-panel rounded-full flex items-center justify-center text-primary hover:text-secondary transition-all active:scale-90 group z-20 shadow-xl">
<div class="absolute inset-0 rounded-full group-hover:bg-secondary/5 transition-colors"></div>
<span class="material-symbols-outlined text-2xl" data-icon="home">home</span>
</button>
<!-- Right: Catalog -->
<button class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-4 w-14 h-14 glass-panel rounded-full flex items-center justify-center text-primary hover:text-secondary transition-all active:scale-90 group z-20 shadow-xl">
<div class="absolute inset-0 rounded-full group-hover:bg-secondary/5 transition-colors"></div>
<span class="material-symbols-outlined text-2xl" data-icon="grid_view">grid_view</span>
</button>
<!-- Central Hub Core (Updated with Glassmorphism) -->
<div class="relative w-40 h-40 glass-panel rounded-full flex flex-col items-center justify-center shadow-2xl overflow-hidden">
<!-- Dotted Texture Overlay -->
<div class="absolute inset-0 dotted-texture opacity-30"></div>
<!-- Subtle Radial Gradient -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_120%,rgba(248,187,115,0.08),transparent)]"></div>
<!-- Central Navigation Knob -->
<div class="relative z-10 w-8 h-8 rounded-full bg-surface-container-highest border border-secondary/30 shadow-[0_0_15px_rgba(248,187,115,0.3)] flex items-center justify-center group cursor-pointer active:scale-90 transition-transform">
<div class="w-3 h-3 rounded-full bg-secondary shadow-[0_0_10px_#f8bb73]"></div>
<!-- Pulse Ring -->
<div class="absolute inset-0 rounded-full border border-secondary/20 animate-ping opacity-20"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Shell -->
<div class="fixed bottom-8 left-0 right-0 z-50 px-6 flex justify-between items-center pointer-events-none">
<!-- Left Container -->
<nav class="pointer-events-auto flex items-center gap-2 p-1.5 rounded-full glass-panel shadow-[0_8px_32px_rgba(0,0,0,0.5),0_0_15px_rgba(248,187,115,0.05)]">
<!-- Home Tab (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary/20 text-secondary rounded-full px-6 py-2 shadow-[0_0_15px_rgba(248,187,115,0.2)] active:scale-95 transition-all duration-200 border border-secondary/30">
<span class="material-symbols-outlined text-xl" data-icon="home">home</span>
<span class="font-label text-[10px] uppercase tracking-tighter mt-0.5">Home</span>
</button>
<!-- Catalog Tab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 px-6 py-2 hover:text-secondary transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined text-xl" data-icon="grid_view">grid_view</span>
<span class="font-label text-[10px] uppercase tracking-tighter mt-0.5">Catalog</span>
</button>
</nav>
<!-- Right Container -->
<nav class="pointer-events-auto flex items-center p-1.5 rounded-full glass-panel shadow-[0_8px_32px_rgba(0,0,0,0.5),0_0_15px_rgba(248,187,115,0.05)]">
<!-- AR Tab -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 px-6 py-2 hover:text-secondary transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined text-xl" data-icon="view_in_ar">view_in_ar</span>
<span class="font-label text-[10px] uppercase tracking-tighter mt-0.5">AR</span>
</button>
</nav>
</div>
</body></html>
